<!-- 手绘 favicon：2×2 卡片网格 = 站点的分类卡片，左上角用系统强调色标记当前分类。
     颜色取浏览器系统色（CanvasText / AccentColor），随系统明暗与强调色自动切换。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" style="color: CanvasText; color-scheme: light dark;">
  <g style="color: AccentColor"><rect x="3" y="3" width="11.6" height="11.6" rx="3.4" fill="currentColor" /></g>
  <rect x="17.4" y="3" width="11.6" height="11.6" rx="3.4" fill="currentColor" opacity=".5" />
  <rect x="3" y="17.4" width="11.6" height="11.6" rx="3.4" fill="currentColor" opacity=".5" />
  <rect x="17.4" y="17.4" width="11.6" height="11.6" rx="3.4" fill="currentColor" opacity=".5" />
</svg>
