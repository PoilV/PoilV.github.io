<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/pinyin-pro" defer></script>
<script src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js" defer></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --card: Field;
    --text: CanvasText;
    --border: color-mix(in srgb, CanvasText 16%, transparent);
    --accent: AccentColor;
    --shadow: 0 1px 3px color-mix(in srgb, CanvasText 15%, transparent);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); cursor: pointer;
    font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .nav-toggle:hover { border-color: var(--accent); }
  #search {
    flex: 1; min-width: 0; max-width: 520px; margin: 0 auto;
    padding: 10px 16px; font-size: 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search:focus-visible, .nav-toggle:focus-visible, a.card:focus-visible, #sideNav a:focus-visible, footer a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .loading { text-align: center; padding: 60px 0; font-size: 14px; }
  .count { font-size: 13px; text-align: center; padding: 10px; display: none; }
  section { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
  section h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
  }
  section h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent);
  }
  section h2 .lucide { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card img { width: 32px; height: 32px; padding: 4px; object-fit: contain; border-radius: 8px; background: var(--border); flex-shrink: 0; }
  a.card .fb {
    display: none; width: 32px; height: 32px; border-radius: 8px;
    background: var(--border);
    font-size: 14px; font-weight: 700; flex-shrink: 0;
    align-items: center; justify-content: center;
  }
  a.card .info { min-width: 0; }
  a.card .name { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.card .host { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .no-result { text-align: center; padding: 60px 0; display: none; }
  footer { text-align: center; font-size: 12px; padding: 32px 0 24px; margin-left: 170px; }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--accent); }
  #sideNav {
    position: fixed; top: 0; bottom: 0; left: 0; width: 170px; z-index: 20;
    background: var(--bg); border-right: 1px solid var(--border);
    padding: 78px 10px 20px; overflow-y: auto;
    transform: translateX(0); visibility: visible;
    transition: transform .2s, visibility .2s;
  }
  #sideNav a {
    display: block; padding: 7px 12px; border-radius: 8px;
    color: inherit; text-decoration: none; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sideNav a:hover { color: var(--text); background: var(--card); }
  #sideNav a.active { color: var(--accent); background: var(--card); font-weight: 600; }
  #navBackdrop {
    position: fixed; inset: 0; z-index: 15;
    background: color-mix(in srgb, CanvasText 20%, transparent);
    display: none;
  }
  #loading, #count, #noResult, #content, footer { margin-left: 170px; transition: margin-left .2s; }
  section { scroll-margin-top: 72px; }
  @media (max-width: 900px) {
    #sideNav { transform: translateX(-100%); visibility: hidden; }
    html.nav-open #sideNav { transform: translateX(0); visibility: visible; }
    html.nav-open #navBackdrop { display: block; }
    #loading, #count, #noResult, #content, footer { margin-left: 0; }
  }
  @media (min-width: 901px) {
    html.nav-closed #sideNav { transform: translateX(-100%); visibility: hidden; }
    html.nav-closed #loading,
    html.nav-closed #count,
    html.nav-closed #noResult,
    html.nav-closed #content,
    html.nav-closed footer { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <button id="navToggle" class="nav-toggle" type="button" aria-label="展开或收起分类导航" aria-expanded="true" aria-controls="sideNav">☰</button>
  <h1>导航</h1>
  <input id="search" type="search" placeholder="搜索名称、拼音或网址…" aria-label="搜索" autocomplete="off" spellcheck="false">
</header>

<nav id="sideNav"></nav>
<div id="navBackdrop"></div>

<div class="loading" id="loading" role="status">加载中…</div>
<div class="count" id="count" aria-live="polite"></div>
<div class="no-result" id="noResult" aria-live="polite">没有匹配的链接</div>

<div id="content"></div>

<footer><a href="https://github.com/PoilV/PoilV.github.io" target="_blank" rel="noopener noreferrer">PoilV · 个人导航 · GitHub</a></footer>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hostOf = url => {
  try { return new URL(url, location.href).hostname; } catch (e) { return ""; }
};
const hrefOf = url => {
  try { return new URL(url, location.href).href; } catch (e) { return String(url); }
};
const pyKey = s => {
  try {
    if (window.pinyin) return window.pinyin(s, { toneType: "none", type: "array" }).join("").toLowerCase().replace(/[^a-z0-9]/g, "");
  } catch (e) {}
  return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
};
const pyFirst = s => {
  try {
    if (window.pinyin) return window.pinyin(s, { toneType: "none", type: "array", pattern: "first" }).join("").toLowerCase().replace(/[^a-z0-9]/g, "");
  } catch (e) {}
  return "";
};
const nhost = h => h.replace(/^www\./, "");
const normalize = l => typeof l === "string" ? { url: l } : l;
const nameOf = l => (l.name || hostOf(l.url) || "");
const catKey = name => pyKey(name || "");
const searchText = l => [l.url, nameOf(l), pyKey(nameOf(l)), pyFirst(nameOf(l))].join(" ").toLowerCase();
const iconCandidates = link => {
  const out = [];
  if (link.icon) out.push(link.icon); // 手动指定，最高优先
  const host = hostOf(link.url);
  if (host) out.push("https://favicon.im/" + host + "?larger=true&throw-error-on-404=true"); // 服务兜底（缺失时 404，触发字母回退）
  return out;
};

const showFallback = img => {
  img.onerror = null;
  img.onload = null;
  const fb = img.parentElement && img.parentElement.querySelector(".fb");
  img.remove();
  if (fb) fb.style.display = "flex";
};
const iconProbeCache = new Map();
const probeIcon = src => {
  if (!iconProbeCache.has(src)) {
    const p = new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve(true);
      im.onerror = () => { iconProbeCache.delete(src); resolve(false); };
      im.src = src;
    });
    iconProbeCache.set(src, p);
  }
  return iconProbeCache.get(src);
};
function setIcon(img, link) {
  const cands = iconCandidates(link);
  if (!cands.length) { showFallback(img); return; }
  // 候选请求全局缓存；先完成的先显示，后到的只有优先级更高（索引更小）才替换
  let shown = -1;
  let pending = cands.length;
  cands.forEach((c, i) => {
    probeIcon(c).then(ok => {
      pending -= 1;
      if (!img.isConnected) return;
      if (ok && (shown === -1 || i < shown)) {
        img.src = c;
        shown = i;
      }
      if (pending === 0 && shown === -1) showFallback(img);
    });
  });
}
const cardHTML = link => {
  link = normalize(link);
  const host = hostOf(link.url);
  const name = link.name || host;
  return `
    <a class="card" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">
      <img alt="" loading="lazy" decoding="async">
      <span class="fb">${host ? esc((nhost(host)[0] || "?").toUpperCase()) : "?"}</span>
      <span class="info">
        <span class="name" title="${esc(name)}">${esc(name)}</span>
        <span class="host" title="${esc(host)}">${esc(host)}</span>
      </span>
    </a>`;
};

const content = document.getElementById("content");
const countEl = document.getElementById("count");
const noResult = document.getElementById("noResult");
const search = document.getElementById("search");
const sideNav = document.getElementById("sideNav");
const navToggle = document.getElementById("navToggle");
const navBackdrop = document.getElementById("navBackdrop");
const mqMobile = matchMedia("(max-width: 900px)");
const loading = document.getElementById("loading");
let config = { categories: [] };
let total = 0;
let linksFailed = false;
let dataLoaded = false;
const linkByHref = new Map();

async function loadLinks() {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 8000);
  try {
    const r = await fetch("links.json", { cache: "no-cache", signal: c.signal });
    if (r.ok) {
      const data = await r.json();
      if (data && Array.isArray(data.categories)) {
        config.categories = data.categories;
        return true;
      }
    }
  } catch (e) {}
  finally { clearTimeout(t); }
  return false;
}

function render(q) {
  q = (q || "").trim().toLowerCase();
  buildLinkIndex();
  let html = "", t = 0, nav = "";
  const cats = config.categories
    .map(cat => ({ cat, key: catKey(cat.name) }))
    .sort((a, b) => a.key.localeCompare(b.key));
  cats.forEach((entry, i) => {
    const links = (entry.cat.links || [])
      .map(normalize)
      .filter(l => !q || searchText(l).includes(q))
      .map(link => ({ link, key: pyKey(nameOf(link)) }))
      .sort((a, b) => a.key.localeCompare(b.key));
    if (!links.length) return;
    t += links.length;
    const catIcon = entry.cat.icon ? `<i data-lucide="${esc(entry.cat.icon)}" aria-hidden="true"></i>` : "";
    html += `<section id="cat-${i}"><h2>${catIcon}${esc(entry.cat.name)}</h2><div class="grid">${links.map(x => cardHTML(x.link)).join("")}</div></section>`;
    nav += `<a href="#cat-${i}" data-i="${i}">${esc(entry.cat.name)}</a>`;
  });
  total = t;
  content.innerHTML = html;
  sideNav.innerHTML = nav;
  if (window.lucide) lucide.createIcons();
  bindNavObserver();
  bindIconObserver();
  loading.style.display = "none";
  countEl.textContent = `共 ${total} 条链接${q ? `，匹配 ${total} 条` : ""}`;
  countEl.style.display = q ? "block" : "none";
  const empty = !total && linksFailed;
  noResult.textContent = empty ? "数据加载失败，请检查网络后刷新重试" : "没有匹配的链接";
  noResult.style.display = (q && !total) || empty ? "block" : "none";
}
function buildLinkIndex() {
  linkByHref.clear();
  for (const cat of config.categories) {
    for (const raw of cat.links || []) {
      const link = normalize(raw);
      const key = hrefOf(link.url);
      if (!linkByHref.has(key)) linkByHref.set(key, link);
    }
  }
}
function findLink(href) {
  return linkByHref.get(href) || { url: href };
}

sideNav.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const sec = document.getElementById(a.dataset.i ? "cat-" + a.dataset.i : "cat-0");
  if (sec) sec.scrollIntoView({ behavior: "smooth" });
  closeMobileNav();
});

function navIsOpen() {
  return mqMobile.matches
    ? document.documentElement.classList.contains("nav-open")
    : !document.documentElement.classList.contains("nav-closed");
}
function updateNavToggle() {
  navToggle.textContent = navIsOpen() ? "✕" : "☰";
  navToggle.setAttribute("aria-expanded", navIsOpen() ? "true" : "false");
}
function closeMobileNav() {
  if (mqMobile.matches && document.documentElement.classList.contains("nav-open")) {
    document.documentElement.classList.remove("nav-open");
    updateNavToggle();
  }
}
function syncNavState() {
  if (mqMobile.matches) {
    document.documentElement.classList.remove("nav-closed");
  } else {
    document.documentElement.classList.remove("nav-open");
  }
  updateNavToggle();
}
navToggle.addEventListener("click", () => {
  if (mqMobile.matches) {
    document.documentElement.classList.toggle("nav-open");
  } else {
    document.documentElement.classList.toggle("nav-closed");
  }
  updateNavToggle();
});
navBackdrop.addEventListener("click", closeMobileNav);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeMobileNav();
});
mqMobile.addEventListener("change", syncNavState);
syncNavState();

let navObserver = null;
function bindNavObserver() {
  if (navObserver) navObserver.disconnect();
  navObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting) {
        sideNav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.i === en.target.id.replace("cat-", "")));
      }
    }
  }, { rootMargin: "-25% 0px -65% 0px" });
  content.querySelectorAll("section").forEach(s => navObserver.observe(s));
}

let iconObserver = null;
function bindIconObserver() {
  if (iconObserver) iconObserver.disconnect();
  const cards = content.querySelectorAll("a.card");
  if (!("IntersectionObserver" in window)) {
    cards.forEach(a => setIcon(a.querySelector("img"), findLink(a.href)));
    return;
  }
  iconObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting || !en.target.isConnected) continue;
      iconObserver.unobserve(en.target);
      setIcon(en.target.querySelector("img"), findLink(en.target.href));
    }
  }, { rootMargin: "200px 0px" });
  cards.forEach(a => iconObserver.observe(a));
}

loadLinks().then(ok => {
  linksFailed = !ok;
  dataLoaded = true;
  render(search.value);
});
let debounceId;
search.addEventListener("input", e => {
  clearTimeout(debounceId);
  debounceId = setTimeout(() => { if (dataLoaded) render(e.target.value); }, 200);
});
window.addEventListener("pinyin-ready", () => { if (dataLoaded) render(search.value); });
let pinyinReady = false;
const initPinyin = () => {
  if (pinyinReady || !window.pinyinPro) return;
  pinyinReady = true;
  window.pinyin = window.pinyinPro.pinyin;
  window.dispatchEvent(new Event("pinyin-ready"));
};
const initLucide = () => { if (window.lucide) lucide.createIcons(); };
document.addEventListener("DOMContentLoaded", () => { initPinyin(); initLucide(); });
window.addEventListener("load", () => { initPinyin(); initLucide(); });
initPinyin();
</script>
</body>
</html>
