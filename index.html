<!DOCTYPE html>
<html lang="zh-CN" class="nav-closed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/pinyin-pro"></script>
<script src="https://unpkg.com/lucide"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --card: Field;
    --text: CanvasText;
    --border: color-mix(in srgb, CanvasText 16%, transparent);
    --accent: AccentColor;
    --shadow: 0 1px 3px color-mix(in srgb, CanvasText 15%, transparent);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background .3s, color .3s; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 顶栏 */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .nav-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .nav-toggle .lucide { width: 18px; height: 18px; }
  .nav-toggle i::before { content: "☰"; font-style: normal; font-size: 16px; } /* lucide 加载失败时的兜底 */
  .nav-toggle:hover { border-color: var(--accent); }
  .search-box {
    flex: 1; min-width: 0; max-width: 520px; margin: 0 auto;
    position: relative; display: flex; align-items: center;
  }
  .search-box .lucide { position: absolute; left: 12px; width: 16px; height: 16px; opacity: .6; pointer-events: none; }
  #search {
    width: 100%;
    padding: 10px 16px 10px 36px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  #search:focus { border-color: var(--accent); }

  /* 左侧导航 */
  #sideNav {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
    width: 170px; padding: 78px 10px 20px; overflow-y: auto;
    background: var(--bg); border-right: 1px solid var(--border);
    transform: translateX(0); visibility: visible;
    transition: transform .2s, visibility .2s;
  }
  #sideNav a {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 8px;
    color: inherit; text-decoration: none; font-size: 13px;
  }
  #sideNav a span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sideNav a .lucide { width: 15px; height: 15px; flex-shrink: 0; opacity: .8; }
  #sideNav a:hover { background: var(--card); }
  #sideNav a.active { color: var(--accent); background: var(--card); font-weight: 600; }
  #sideNav a[data-hidden] { opacity: .6; } /* 未解锁的隐藏分类 */
  #navBackdrop {
    position: fixed; inset: 0; z-index: 15;
    background: color-mix(in srgb, CanvasText 20%, transparent);
    display: none;
  }

  /* 主体 */
  main { margin-left: 170px; transition: margin-left .2s; }
  #status { text-align: center; font-size: 13px; padding: 24px 0; }
  section { max-width: 1080px; margin: 24px auto; padding: 0 24px; scroll-margin-top: 72px; }
  section h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
  }
  section h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
  section h2 .lucide { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); text-decoration: none;
    box-shadow: var(--shadow);
    transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card img, a.card .fb {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 8px; background: var(--border);
  }
  a.card img { padding: 4px; object-fit: contain; }
  a.card .fb {
    display: none;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  a.card .info { min-width: 0; }
  a.card .name, a.card .host {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  a.card .name { font-size: 14px; font-weight: 600; }
  a.card .host { font-size: 12px; }
  footer { text-align: center; font-size: 12px; padding: 32px 0 24px; }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 900px) {
    #sideNav { transform: translateX(-100%); visibility: hidden; }
    html.nav-open #sideNav { transform: translateX(0); visibility: visible; }
    html.nav-open #navBackdrop { display: block; }
    main { margin-left: 0; }
  }
  @media (min-width: 901px) {
    html.nav-closed #sideNav { transform: translateX(-100%); visibility: hidden; }
    html.nav-closed main { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <button id="navToggle" class="nav-toggle" type="button" aria-label="展开或收起分类导航" aria-expanded="false" aria-controls="sideNav"><i data-lucide="menu" aria-hidden="true"></i></button>
  <h1>导航</h1>
  <div class="search-box">
    <i data-lucide="search" aria-hidden="true"></i>
    <input id="search" type="search" placeholder="搜索" aria-label="搜索" autocomplete="off" spellcheck="false">
  </div>
</header>

<nav id="sideNav"></nav>
<div id="navBackdrop"></div>

<main>
  <div id="status" role="status" aria-live="polite">加载中…</div>
  <div id="content"></div>
  <footer><a href="https://github.com/PoilV/PoilV.github.io" target="_blank" rel="noopener noreferrer">PoilV · 个人导航 · GitHub</a></footer>
</main>

<script>
// ---------- 工具函数 ----------
const escMap = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s).replace(/[&<>"']/g, c => escMap[c]);
const hostOf = url => { try { return new URL(url, location.href).hostname; } catch (e) { return ""; } };
const normalize = l => typeof l === "string" ? { url: l } : l;
const nameOf = l => l.name || hostOf(l.url) || "";
// 拼音排序/搜索键；CDN 失败时退回原文匹配
const py = (s, opts = {}) => {
  try {
    if (window.pinyin) return window.pinyin(s, { toneType: "none", type: "array", ...opts }).join("").toLowerCase().replace(/[^a-z0-9]/g, "");
  } catch (e) {}
  return null;
};
const pyKey = s => py(s) || s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
const pyFirst = s => py(s, { pattern: "first" }) || "";
const searchText = l => {
  const n = nameOf(l);
  return [l.url, n, pyKey(n), pyFirst(n)].join(" ").toLowerCase();
};

// ---------- 站点图标（手动 icon → favicon.im → 首字母回退） ----------
const iconCandidates = link => {
  const out = [];
  if (link.icon) out.push(link.icon);
  const host = hostOf(link.url);
  if (host) out.push("https://favicon.im/" + host + "?larger=true&throw-error-on-404=true");
  return out;
};
const showFallback = img => {
  const fb = img.parentElement && img.parentElement.querySelector(".fb");
  img.remove();
  if (fb) fb.style.display = "flex";
};
const iconCache = new Map(); // 探测结果缓存；失败不缓存，允许重试
const probeIcon = src => {
  if (!iconCache.has(src)) {
    const p = new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve(true);
      im.onerror = () => { iconCache.delete(src); resolve(false); };
      im.src = src;
    });
    iconCache.set(src, p);
  }
  return iconCache.get(src);
};
async function setIcon(img, link) {
  for (const c of iconCandidates(link)) {
    if (await probeIcon(c)) { img.src = c; return; }
  }
  showFallback(img);
}

// ---------- 数据与渲染 ----------
const content = document.getElementById("content");
const status = document.getElementById("status");
const search = document.getElementById("search");
const sideNav = document.getElementById("sideNav");
const navToggle = document.getElementById("navToggle");
const navBackdrop = document.getElementById("navBackdrop");
const mqMobile = matchMedia("(max-width: 900px)");
let config = { categories: [] };
let linksFailed = false;
let dataLoaded = false;
const revealed = new Set(); // 点击左侧导航解锁的隐藏分类

async function loadLinks() {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 8000);
  try {
    const r = await fetch("links.json", { cache: "no-cache", signal: c.signal });
    if (r.ok) {
      const data = await r.json();
      if (data && Array.isArray(data.categories)) {
        config.categories = data.categories;
        return true;
      }
    }
  } catch (e) {}
  finally { clearTimeout(t); }
  return false;
}

function cardHTML(link) {
  const host = hostOf(link.url);
  const name = nameOf(link);
  return `
    <a class="card" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer" data-icon="${esc(link.icon || "")}">
      <img alt="" loading="lazy" decoding="async">
      <span class="fb">${host ? esc((host.replace(/^www\./, "")[0] || "?").toUpperCase()) : "?"}</span>
      <span class="info">
        <span class="name" title="${esc(name)}">${esc(name)}</span>
        <span class="host" title="${esc(host)}">${esc(host)}</span>
      </span>
    </a>`;
}

function render(q) {
  q = (q || "").trim().toLowerCase();
  let html = "", nav = "", total = 0;
  const cats = config.categories
    .map(cat => ({ cat, key: pyKey(cat.name || "") }))
    .sort((a, b) => a.key.localeCompare(b.key));
  cats.forEach((entry, i) => {
    const links = (entry.cat.links || [])
      .map(normalize)
      .filter(l => !q || searchText(l).includes(q))
      .map(link => ({ link, key: pyKey(nameOf(link)) }))
      .sort((a, b) => a.key.localeCompare(b.key));
    if (!links.length) return;
    const icon = entry.cat.icon ? `<i data-lucide="${esc(entry.cat.icon)}" aria-hidden="true"></i>` : "";
    const hidden = entry.cat.hidden && !revealed.has(entry.cat.name);
    nav += `<a href="#cat-${i}" data-cat="${esc(entry.cat.name)}"${hidden ? ` data-hidden="1"` : ""}>${icon}<span>${esc(entry.cat.name)}</span></a>`;
    if (hidden) return; // 隐藏分类只进导航，内容解锁后才渲染
    total += links.length;
    html += `<section id="cat-${i}"><h2>${icon}${esc(entry.cat.name)}</h2><div class="grid">${links.map(x => cardHTML(x.link)).join("")}</div></section>`;
  });
  content.innerHTML = html;
  sideNav.innerHTML = nav;
  if (window.lucide) lucide.createIcons();
  bindNavObserver();
  bindIconObserver();
  let msg = "";
  if (linksFailed && !total) msg = "数据加载失败，请检查网络后刷新重试";
  else if (q) msg = total ? `匹配 ${total} 条` : "没有匹配的链接";
  status.textContent = msg;
  status.style.display = msg ? "block" : "none";
}

// ---------- 左侧导航：折叠 + 点击滚动 + 解锁隐藏分类 ----------
const navIsOpen = () => mqMobile.matches
  ? document.documentElement.classList.contains("nav-open")
  : !document.documentElement.classList.contains("nav-closed");
function setNavOpen(open) {
  document.documentElement.classList.toggle("nav-open", mqMobile.matches && open);
  document.documentElement.classList.toggle("nav-closed", !mqMobile.matches && !open);
  navToggle.setAttribute("aria-expanded", open ? "true" : "false");
}
navToggle.addEventListener("click", () => setNavOpen(!navIsOpen()));
navBackdrop.addEventListener("click", () => setNavOpen(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && mqMobile.matches) setNavOpen(false); });
mqMobile.addEventListener("change", () => setNavOpen(false)); // 跨断点时重置为收起
setNavOpen(navIsOpen()); // 初始同步 aria-expanded

sideNav.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  if (a.dataset.hidden !== undefined && !revealed.has(a.dataset.cat)) {
    revealed.add(a.dataset.cat);
    render(search.value); // 解锁后重建，内容区出现该分类
  }
  const sec = document.getElementById(a.hash.slice(1));
  if (sec) sec.scrollIntoView({ behavior: "smooth" });
  if (mqMobile.matches) setNavOpen(false);
});

// ---------- 滚动高亮 ----------
let navObserver = null;
function bindNavObserver() {
  if (navObserver) navObserver.disconnect();
  navObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting) {
        sideNav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.hash === "#" + en.target.id));
      }
    }
  }, { rootMargin: "-25% 0px -65% 0px" });
  content.querySelectorAll("section").forEach(s => navObserver.observe(s));
}

// ---------- 图标懒加载 ----------
let iconObserver = null;
function bindIconObserver() {
  if (iconObserver) iconObserver.disconnect();
  const setFor = a => setIcon(a.querySelector("img"), { url: a.href, icon: a.dataset.icon || "" });
  iconObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting || !en.target.isConnected) continue;
      iconObserver.unobserve(en.target);
      setFor(en.target);
    }
  }, { rootMargin: "200px 0px" });
  content.querySelectorAll("a.card").forEach(a => iconObserver.observe(a));
}

// ---------- 启动 ----------
loadLinks().then(ok => {
  linksFailed = !ok;
  dataLoaded = true;
  render(search.value);
});
let debounceId;
search.addEventListener("input", e => {
  clearTimeout(debounceId);
  debounceId = setTimeout(() => { if (dataLoaded) render(e.target.value); }, 200);
});
// pinyin-pro 与 lucide 都是同步 script，到这里必然已加载；CDN 失败时各自降级
if (window.pinyinPro) window.pinyin = window.pinyinPro.pinyin;
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
