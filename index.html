<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
try {
  document.documentElement.setAttribute("data-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (e) {}
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --border: #e4e7ed;
    --accent: #e8772e;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card: #1e2126;
    --text: #e6e8eb;
    --muted: #8a919f;
    --border: #2b2f36;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; white-space: nowrap; }
  #search {
    flex: 1; max-width: 520px; margin: 0 auto;
    padding: 10px 16px; font-size: 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; display: none; }
  section { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
  section h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
  }
  section h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card img { width: 32px; height: 32px; padding: 4px; object-fit: contain; border-radius: 8px; background: var(--border); flex-shrink: 0; }
  a.card .fb {
    display: none; width: 32px; height: 32px; border-radius: 8px;
    background: var(--border); color: var(--muted);
    font-size: 14px; font-weight: 700; flex-shrink: 0;
    align-items: center; justify-content: center;
  }
  a.card .info { min-width: 0; }
  a.card .name { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.card .host { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .no-result { text-align: center; color: var(--muted); padding: 60px 0; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 32px 0 24px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  .fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--accent);
    font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
  }
  #copyBtn { bottom: 78px; font-size: 15px; }
  .fab:hover { border-color: var(--accent); }
  .modal {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.35); align-items: center; justify-content: center;
  }
  .modal-box {
    width: min(420px, 90vw); background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
  }
  .modal-box input {
    width: 100%; padding: 10px 14px; font-size: 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); outline: none; margin: 10px 0;
  }
  .modal-box input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 16px; cursor: pointer; font-size: 14px;
  }
  #modalOk { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card-wrap { position: relative; }
  .del {
    position: absolute; top: 6px; right: 8px; z-index: 2;
    display: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--border); color: var(--muted);
    font-size: 11px; line-height: 20px; text-align: center; cursor: pointer;
  }
  .card-wrap:hover .del { display: block; }
  .del:hover { color: #fff; background: #e5484d; }
  #sideNav {
    position: fixed; top: 0; bottom: 0; left: 0; width: 170px; z-index: 15;
    background: var(--bg); border-right: 1px solid var(--border);
    padding: 74px 10px 20px; overflow-y: auto;
  }
  #sideNav a {
    display: block; padding: 7px 12px; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sideNav a:hover { color: var(--text); background: var(--card); }
  #sideNav a.active { color: var(--accent); background: var(--card); font-weight: 600; }
  #count, #noResult, #content { margin-left: 170px; }
  section { scroll-margin-top: 16px; }
  @media (max-width: 900px) {
    #sideNav { display: none; }
    #count, #noResult, #content { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>我的导航</h1>
  <input id="search" type="text" placeholder="搜索链接、名称或网址…">
</header>

<nav id="sideNav"></nav>

<div class="count" id="count"></div>
<div class="no-result" id="noResult">没有匹配的链接</div>

<div id="content"></div>

<footer><a href="https://github.com/PoilV/PoilV.github.io" target="_blank" rel="noopener noreferrer">PoilV · 个人导航</a></footer>

<button class="fab" id="copyBtn" title="复制自定义链接代码">⧉</button>
<button class="fab" id="addBtn" title="添加链接">＋</button>

<div class="modal" id="modal">
  <div class="modal-box">
    <div style="font-size:15px;font-weight:600">添加链接</div>
    <input id="newUrl" type="text" placeholder="https://…" autocomplete="off">
    <input id="newName" type="text" placeholder="名字（可选）" autocomplete="off">
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalOk">确定</button>
    </div>
  </div>
</div>

<script>
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  document.documentElement.setAttribute("data-theme", mq.matches ? "dark" : "light");
}
mq.addEventListener("change", applyTheme);
applyTheme();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hostOf = url => {
  try { return new URL(url).hostname; } catch (e) { return ""; }
};
const nhost = h => h.replace(/^www\./, "");
let titlesJson = {};
let iconsJson = {};
async function loadJson(name, target) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 4000);
  try {
    const r = await fetch(name, { cache: "no-store", signal: c.signal });
    if (r.ok) Object.assign(target, await r.json());
  } catch (e) {}
  finally { clearTimeout(t); }
}
function titleOf(url) { return titlesJson[url] || ""; }
const FAV_SOURCES = [
  { id: "direct", url: h => "https://" + h + "/favicon.ico" },
];
const favCache = new Map();
const favProbes = new Map();
const probeFavicons = host => new Promise(resolve => {
  let i = 0, done = false;
  const next = () => {
    if (done) return;
    if (i >= FAV_SOURCES.length) { done = true; resolve(null); return; }
    const s = FAV_SOURCES[i++];
    const img = new Image();
    const finish = ok => {
      if (done) return;
      done = true;
      resolve(ok ? s : null);
    };
    img.onload = () => finish(true);
    img.onerror = () => finish(false);
    img.src = s.url(host);
    setTimeout(() => finish(false), 5000);
  };
  next();
});
const sourceFor = host => {
  if (favCache.has(host)) return Promise.resolve(favCache.get(host));
  if (favProbes.has(host)) return favProbes.get(host);
  const p = probeFavicons(host).then(s => {
    favCache.set(host, s);
    favProbes.delete(host);
    return s;
  });
  favProbes.set(host, p);
  return p;
};
const showFallback = img => {
  img.onerror = null;
  img.onload = null;
  const fb = img.parentElement && img.parentElement.querySelector(".fb");
  img.remove();
  if (fb) fb.style.display = "flex";
};
function setFavicon(img, host) {
  if (!host) { showFallback(img); return; }
  const a = img.closest("a");
  const url = a && a.dataset.url;
  if (!img.dataset.icon && url && iconsJson[url]) img.dataset.icon = iconsJson[url];
  if (img.dataset.icon) {
    img.onerror = () => {
      img.dataset.icon = "";
      setFavicon(img, host);
    };
    img.src = img.dataset.icon;
    return;
  }
  sourceFor(host).then(src => {
    if (!src) { showFallback(img); return; }
    img.onerror = () => showFallback(img);
    img.src = src.url(host);
  });
}
const cardHTML = (link, custom) => {
  const host = hostOf(link.url);
  const name = link.name || titleOf(link.url) || host;
  return `
    <div class="card-wrap">
      <a class="card" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer" data-url="${esc(link.url)}">
        <img alt="" loading="lazy">
        <span class="fb">${host ? esc((nhost(host)[0] || "?").toUpperCase()) : "?"}</span>
        <span class="info">
          <span class="name" title="${esc(name)}">${esc(name)}</span>
          <span class="host" title="${esc(host)}">${esc(host)}</span>
        </span>
      </a>
      ${custom ? `<span class="del" data-url="${esc(link.url)}" title="删除">✕</span>` : ""}
    </div>`;
};

const content = document.getElementById("content");
const countEl = document.getElementById("count");
const noResult = document.getElementById("noResult");
const search = document.getElementById("search");
const addBtn = document.getElementById("addBtn");
const copyBtn = document.getElementById("copyBtn");
const sideNav = document.getElementById("sideNav");
const modal = document.getElementById("modal");
const newUrl = document.getElementById("newUrl");
const newName = document.getElementById("newName");
let config = { categories: [] };
let customLinks = [];
try { customLinks = JSON.parse(localStorage.getItem("customLinks") || "[]"); } catch (e) { customLinks = []; }
const saveCustom = () => { try { localStorage.setItem("customLinks", JSON.stringify(customLinks)); } catch (e) {} };
const normalize = l => typeof l === "string" ? { url: l } : l;
let total = 0;

function render(q) {
  q = (q || "").trim().toLowerCase();
  let html = "", matched = 0, t = 0, nav = "";
  const cats = config.categories.concat(customLinks.length ? [{ name: "我的", links: customLinks }] : []);
  cats.forEach((cat, i) => {
    const links = cat.links.map(normalize).filter(l =>
      !q || l.url.toLowerCase().includes(q) || (l.name || "").toLowerCase().includes(q) || titleOf(l.url).toLowerCase().includes(q)
    );
    if (!links.length) return;
    t += links.length;
    matched += links.length;
    const custom = cat.name === "我的";
    html += `<section id="cat-${i}"><h2>${esc(cat.name)}</h2><div class="grid">${links.map(l => cardHTML(l, custom)).join("")}</div></section>`;
    nav += `<a href="#cat-${i}" data-i="${i}">${esc(cat.name)}</a>`;
  });
  total = t;
  content.innerHTML = html;
  sideNav.innerHTML = nav;
  bindNavObserver();
  content.querySelectorAll("a.card img").forEach(img => setFavicon(img, hostOf(img.closest("a").dataset.url)));
  countEl.textContent = `共 ${total} 条链接${q ? `，匹配 ${matched} 条` : ""}`;
  countEl.style.display = q ? "block" : "none";
  noResult.style.display = q && !matched ? "block" : "none";
}

sideNav.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const sec = document.getElementById(a.dataset.i ? "cat-" + a.dataset.i : "cat-0");
  if (sec) sec.scrollIntoView({ behavior: "smooth" });
});
let navObserver = null;
function bindNavObserver() {
  if (navObserver) navObserver.disconnect();
  navObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting) {
        sideNav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.i === en.target.id.replace("cat-", "")));
      }
    }
  }, { rootMargin: "-25% 0px -65% 0px" });
  content.querySelectorAll("section").forEach(s => navObserver.observe(s));
}

addBtn.onclick = () => { modal.style.display = "flex"; newUrl.value = ""; newName.value = ""; newUrl.focus(); };
modalCancel.onclick = () => { modal.style.display = "none"; };
newUrl.addEventListener("keydown", e => { if (e.key === "Enter") modalOk.click(); });
modalOk.onclick = () => {
  const u = newUrl.value.trim();
  const n = newName.value.trim();
  modal.style.display = "none";
  if (!u) return;
  customLinks = customLinks.filter(l => normalize(l).url !== u);
  customLinks.push(n ? { url: u, name: n } : u);
  saveCustom();
  render(search.value);
};
content.addEventListener("click", e => {
  const del = e.target.closest(".del");
  if (!del) return;
  e.preventDefault();
  const u = del.dataset.url;
  customLinks = customLinks.filter(l => normalize(l).url !== u);
  saveCustom();
  render(search.value);
});
copyBtn.onclick = async () => {
  if (!customLinks.length) { copyBtn.textContent = "—"; setTimeout(() => copyBtn.textContent = "⧉", 1000); return; }
  const code = customLinks.map(l => `    { url: ${JSON.stringify(normalize(l).url)} },`).join("\n");
  try {
    await navigator.clipboard.writeText(code);
    copyBtn.textContent = "✓";
  } catch (e) { copyBtn.textContent = "✗"; }
  setTimeout(() => copyBtn.textContent = "⧉", 1200);
};

render("");
loadJson("links.json", config).then(() => render(search.value));
loadJson("data/titles.json", titlesJson).then(() => render(search.value));
loadJson("data/icons.json", iconsJson).then(() => render(search.value));
let debounceId;
search.addEventListener("input", e => {
  clearTimeout(debounceId);
  debounceId = setTimeout(() => render(e.target.value), 200);
});
</script>
</body>
</html>
