<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/pinyin-pro" defer></script>
<script>
try {
  document.documentElement.setAttribute("data-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (e) {}
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --border: #e4e7ed;
    --accent: #e8772e;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @supports (color: AccentColor) {
    :root { --accent: AccentColor; }
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card: #1e2126;
    --text: #e6e8eb;
    --muted: #8a919f;
    --border: #2b2f36;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; white-space: nowrap; }
  #search {
    flex: 1; max-width: 520px; margin: 0 auto;
    padding: 10px 16px; font-size: 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; display: none; }
  section { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
  section h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600; margin-bottom: 14px;
  }
  section h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.card img { width: 32px; height: 32px; padding: 4px; object-fit: contain; border-radius: 8px; background: var(--border); flex-shrink: 0; }
  a.card .fb {
    display: none; width: 32px; height: 32px; border-radius: 8px;
    background: var(--border); color: var(--muted);
    font-size: 14px; font-weight: 700; flex-shrink: 0;
    align-items: center; justify-content: center;
  }
  a.card .info { min-width: 0; }
  a.card .name { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.card .host { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .no-result { text-align: center; color: var(--muted); padding: 60px 0; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 32px 0 24px; margin-left: 170px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  #sideNav {
    position: fixed; top: 0; bottom: 0; left: 0; width: 170px; z-index: 5;
    background: var(--bg); border-right: 1px solid var(--border);
    padding: 78px 10px 20px; overflow-y: auto;
  }
  #sideNav a {
    display: block; padding: 7px 12px; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sideNav a:hover { color: var(--text); background: var(--card); }
  #sideNav a.active { color: var(--accent); background: var(--card); font-weight: 600; }
  #count, #noResult, #content { margin-left: 170px; }
  section { scroll-margin-top: 72px; }
  @media (max-width: 900px) {
    #sideNav { display: none; }
    #count, #noResult, #content, footer { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>我的导航</h1>
  <input id="search" type="search" placeholder="搜索链接、名称或网址…" aria-label="搜索" autocomplete="off" spellcheck="false">
</header>

<nav id="sideNav"></nav>

<div class="count" id="count"></div>
<div class="no-result" id="noResult">没有匹配的链接</div>

<div id="content"></div>

<footer><a href="https://github.com/PoilV/PoilV.github.io" target="_blank" rel="noopener noreferrer">PoilV · 个人导航</a></footer>

<script>
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  document.documentElement.setAttribute("data-theme", mq.matches ? "dark" : "light");
}
mq.addEventListener("change", applyTheme);
applyTheme();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hostOf = url => {
  try { return new URL(url).hostname; } catch (e) { return ""; }
};
const pyKey = s => {
  try {
    if (window.pinyin) return window.pinyin(s, { toneType: "none", type: "array" }).join("").toLowerCase();
  } catch (e) {}
  return s.toLowerCase();
};
const nhost = h => h.replace(/^www\./, "");
const normalize = l => typeof l === "string" ? { url: l } : l;
const nameOf = l => (l.name || hostOf(l.url) || "");
const catKey = c => pyKey(c.name || "");
const compareCats = (a, b) => catKey(a).localeCompare(catKey(b));
const compareLinks = (a, b) => pyKey(nameOf(a)).localeCompare(pyKey(nameOf(b)));
const iconCandidates = link => {
  const out = [];
  if (link.icon) out.push(link.icon); // 手动指定，最高优先
  const host = hostOf(link.url);
  if (host) out.push("https://favicon.im/" + host + "?larger=true&throw-error-on-404=true"); // 服务兜底（缺失时 404，触发字母回退）
  return out;
};

const showFallback = img => {
  img.onerror = null;
  img.onload = null;
  const fb = img.parentElement && img.parentElement.querySelector(".fb");
  img.remove();
  if (fb) fb.style.display = "flex";
};
function setIcon(img, link) {
  const cands = iconCandidates(link);
  if (!cands.length) { showFallback(img); return; }
  // 并行加载所有候选：先完成的先显示；手动图标后到则替换（优先级更高）
  let shown = null;
  const finished = new Set();
  const tryShow = () => {
    for (const c of cands) {
      if (finished.has(c) && c !== shown) { img.src = c; shown = c; return; }
    }
    if (finished.size === cands.length && !shown) showFallback(img);
  };
  cands.forEach(c => {
    const p = new Image();
    p.onload = () => { finished.add(c); tryShow(); };
    p.onerror = () => { finished.add(c); tryShow(); };
    p.src = c;
  });
}
const cardHTML = link => {
  link = normalize(link);
  const host = hostOf(link.url);
  const name = link.name || host;
  return `
    <a class="card" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">
      <img alt="" loading="lazy">
      <span class="fb">${host ? esc((nhost(host)[0] || "?").toUpperCase()) : "?"}</span>
      <span class="info">
        <span class="name" title="${esc(name)}">${esc(name)}</span>
        <span class="host" title="${esc(host)}">${esc(host)}</span>
      </span>
    </a>`;
};

const content = document.getElementById("content");
const countEl = document.getElementById("count");
const noResult = document.getElementById("noResult");
const search = document.getElementById("search");
const sideNav = document.getElementById("sideNav");
let config = { categories: [] };
let total = 0;
let linksFailed = false;

async function loadLinks() {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 8000);
  try {
    const r = await fetch("links.json", { cache: "no-cache", signal: c.signal });
    if (r.ok) { Object.assign(config, await r.json()); return true; }
  } catch (e) {}
  finally { clearTimeout(t); }
  return false;
}

function render(q) {
  q = (q || "").trim().toLowerCase();
  let html = "", matched = 0, t = 0, nav = "";
  const cats = [...config.categories].sort(compareCats);
  cats.forEach((cat, i) => {
    const links = cat.links.map(normalize).filter(l =>
      !q || l.url.toLowerCase().includes(q) || nameOf(l).toLowerCase().includes(q)
    ).sort(compareLinks);
    if (!links.length) return;
    t += links.length;
    matched += links.length;
    html += `<section id="cat-${i}"><h2>${esc(cat.name)}</h2><div class="grid">${links.map(cardHTML).join("")}</div></section>`;
    nav += `<a href="#cat-${i}" data-i="${i}">${esc(cat.name)}</a>`;
  });
  total = t;
  content.innerHTML = html;
  sideNav.innerHTML = nav;
  bindNavObserver();
  content.querySelectorAll("a.card").forEach(a => setIcon(a.querySelector("img"), findLink(a.href)));
  countEl.textContent = `共 ${total} 条链接${q ? `，匹配 ${matched} 条` : ""}`;
  countEl.style.display = q ? "block" : "none";
  const empty = !total && linksFailed;
  noResult.textContent = empty ? "数据加载失败，请检查网络后刷新重试" : "没有匹配的链接";
  noResult.style.display = (q && !matched) || empty ? "block" : "none";
}
function findLink(href) {
  for (const cat of config.categories) {
    for (const l of cat.links) {
      const link = normalize(l);
      if (link.url === href) return link;
    }
  }
  return { url: href };
}

sideNav.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const sec = document.getElementById(a.dataset.i ? "cat-" + a.dataset.i : "cat-0");
  if (sec) sec.scrollIntoView({ behavior: "smooth" });
});
let navObserver = null;
function bindNavObserver() {
  if (navObserver) navObserver.disconnect();
  navObserver = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting) {
        sideNav.querySelectorAll("a").forEach(a => a.classList.toggle("active", a.dataset.i === en.target.id.replace("cat-", "")));
      }
    }
  }, { rootMargin: "-25% 0px -65% 0px" });
  content.querySelectorAll("section").forEach(s => navObserver.observe(s));
}

render("");
loadLinks().then(ok => { if (!ok) linksFailed = true; render(search.value); });
let debounceId;
search.addEventListener("input", e => {
  clearTimeout(debounceId);
  debounceId = setTimeout(() => render(e.target.value), 200);
});
window.addEventListener("pinyin-ready", () => render(search.value));
let pinyinReady = false;
const initPinyin = () => {
  if (pinyinReady || !window.pinyinPro) return;
  pinyinReady = true;
  window.pinyin = window.pinyinPro.pinyin;
  window.dispatchEvent(new Event("pinyin-ready"));
};
document.addEventListener("DOMContentLoaded", initPinyin);
window.addEventListener("load", initPinyin);
initPinyin();
</script>
</body>
</html>
