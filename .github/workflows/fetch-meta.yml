name: Fetch titles
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths: ["links.json", "scripts/fetch-meta.js"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON
        run: node -e "['links.json','data/titles.json','data/icons.json'].forEach(f => JSON.parse(require('fs').readFileSync(f,'utf8'))); console.log('all json valid')"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: node scripts/fetch-meta.js
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titles.json data/icons.json
          git diff --cached --quiet || git commit -m "chore: update titles.json / icons.json"
          git push
