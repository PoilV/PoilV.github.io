name: Fetch titles
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: 并发请求数（默认 10）
        required: false
        default: "10"
  push:
    paths: ["links.json", "scripts/fetch-meta.py", ".github/workflows/fetch-meta.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install curl_cffi pillow
      - name: Validate JSON
        run: python -c "import json, os; json.load(open('links.json', encoding='utf8')); [json.load(open(f, encoding='utf8')) for f in ('data/titles.json', 'data/icons.json') if os.path.exists(f)]; print('all json valid')"
      - run: python scripts/fetch-meta.py ${{ inputs.concurrency }}
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titles.json data/icons.json
          git diff --cached --quiet || git commit -m "chore: update titles.json / icons.json"
          git push
