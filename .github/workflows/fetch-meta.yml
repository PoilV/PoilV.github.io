name: Fetch titles
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: 并发请求数（默认 10）
        required: false
        default: "10"
  push:
    paths: ["links.json", "scripts/fetch-meta.js"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install sharp
        run: npm install sharp --no-save --no-package-lock --no-audit --no-fund
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('links.json','utf8')); ['data/titles.json','data/icons.json'].forEach(f => { try { JSON.parse(require('fs').readFileSync(f,'utf8')) } catch (e) {} }); console.log('all json valid')"
      - run: node scripts/fetch-meta.js ${{ inputs.concurrency }}
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titles.json data/icons.json
          git diff --cached --quiet || git commit -m "chore: update titles.json / icons.json"
          git push
