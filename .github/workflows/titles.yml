name: Fetch titles
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths: ["links.js", "scripts/fetch-titles.js"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-titles.js
      - name: Commit titles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add titles.json
          git diff --cached --quiet || git commit -m "chore: update titles.json"
          git push
